name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string

concurrency:
  group: typescript-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use trusted-publishing npm
        run: npm install --global npm@^11.5.1
      - name: Verify, test and build
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.version || github.event.release.tag_name }}"
          expected="${expected#v}"
          actual=$(node -p 'require("./package.json").version')
          test "$actual" = "$expected"
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Clean-install smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iicp-release-smoke
          tgz=$(npm pack --silent --pack-destination /tmp/iicp-release-smoke | tail -1)
          cd /tmp/iicp-release-smoke
          npm init -y >/dev/null
          npm install "./$tgz" >/dev/null
          node -e 'import("@iicp/client").then(() => console.log("import ok"))'
      - name: Publish to npm with OIDC provenance
        run: npm publish --access public --provenance
