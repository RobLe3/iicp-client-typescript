name: Publish release

# Manual-only while the guarded local publisher remains authoritative.
# Enabling release:published before registry trust is validated would create
# two competing publishers for the same immutable version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string

concurrency:
  group: typescript-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Use trusted-publishing npm
        run: npm install --global npm@^11.5.1
      - name: Verify, test and build
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.version }}"
          expected="${expected#v}"
          actual=$(node -p 'require("./package.json").version')
          test "$actual" = "$expected"
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Package and clean-install smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifact /tmp/iicp-release-smoke
          tgz=$(npm pack --silent --pack-destination release-artifact | tail -1)
          cd /tmp/iicp-release-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/release-artifact/$tgz" >/dev/null
          node -e 'import("@iicp/client").then(() => console.log("import ok"))'
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-dist-${{ inputs.version }}
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: typescript-dist-${{ inputs.version }}
          path: release-artifact
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use trusted-publishing npm
        run: npm install --global npm@^11.5.1
      - name: Publish to npm with OIDC provenance
        env:
          # npm >=11.5.1 prefers a matching OIDC publisher and falls back to
          # this scoped token until registry-side trust has been validated.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release-artifact/*.tgz --access public --provenance
