name: Publish to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json)"
        required: true
      fast_mode:
        description: "Skip full test matrix — single Node version, no conformance check (patch/doc-only releases)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  test:
    name: Tests (pre-publish gate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ fromJson(inputs.fast_mode == 'true' && '["20"]' || '["18", "20", "22"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  conformance:
    name: Conformance Mark Coverage
    if: inputs.fast_mode != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify conformance marks
        run: |
          FAIL=0
          for f in tests/*.test.ts; do
            if ! grep -qE "SDK-0[1-9]|SDK-1[0-9]|ADR-016" "$f"; then
              echo "MISSING conformance mark: $f"
              FAIL=1
            fi
          done
          exit $FAIL

  publish:
    name: Publish to npmjs
    needs: [test]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run build
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
